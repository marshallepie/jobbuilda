name: Membership migration artifact validation

on:
  push:
    paths:
      - docs/provider-sql/20261107_add_auth_tenant_memberships.sql
      - docs/AUTH_TENANT_MEMBERSHIPS_RUNBOOK.md
      - services/identity-mcp/scripts/probe-membership-rehearsal-runtime.mjs
      - services/identity-mcp/test/membership-migration-artifact.test.mjs
      - .github/workflows/membership-migration-artifact.yml
  pull_request:
    paths:
      - docs/provider-sql/20261107_add_auth_tenant_memberships.sql
      - docs/AUTH_TENANT_MEMBERSHIPS_RUNBOOK.md
      - services/identity-mcp/scripts/probe-membership-rehearsal-runtime.mjs
      - services/identity-mcp/test/membership-migration-artifact.test.mjs
      - .github/workflows/membership-migration-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, "26"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test services/identity-mcp/test/membership-migration-artifact.test.mjs
